plugins:
  - rubocop-minitest

AllCops:
  TargetRubyVersion: 3.1
  NewCops: enable
  SuggestExtensions: false
  Exclude:
    - "vendor/**/*"
    - "pkg/**/*"

Style/StringLiterals:
  EnforcedStyle: double_quotes
Style/StringLiteralsInInterpolation:
  EnforcedStyle: double_quotes
Style/Documentation:
  Exclude:
    - "test/**/*"
Layout/LineLength:
  Max: 120
Metrics/MethodLength:
  Max: 40
Metrics/CyclomaticComplexity:
  Max: 15
Metrics/PerceivedComplexity:
  Max: 15
Metrics/BlockLength:
  Exclude:
    - "test/**/*"
    - "*.gemspec"
Metrics/ClassLength:
  Exclude:
    - "test/**/*"
Metrics/AbcSize:
  Max: 45
  Exclude:
    - "test/**/*"
Minitest/MultipleAssertions:
  Max: 20
