[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "keepyourprompts"
version = "0.1.0"
description = "Keep Your Prompts SDK: deployed prompts served from memory, refreshed in the background, available when the network is not."
readme = "README.md"
requires-python = ">=3.9"
# PEP 639. LICENSE is the repository root file, copied here by the release workflow.
license = "LicenseRef-Republic-Lex-Aequa-1.0"
license-files = ["LICENSE"]
keywords = ["prompts", "llm", "prompt-management", "anthropic", "openai"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Framework :: AsyncIO",
  "Typing :: Typed",
]
dependencies = []

[project.optional-dependencies]
httpx = ["httpx>=0.24"]
dev = ["pytest>=7", "pytest-asyncio>=0.21", "ruff>=0.6", "httpx>=0.24"]

[project.urls]
Homepage = "https://keepyourprompts.com"
Source = "https://github.com/keep-your-prompts/keep-your-prompts-sdk/tree/main/python"
Changelog = "https://github.com/keep-your-prompts/keep-your-prompts-sdk/blob/main/python/CHANGELOG.md"

[project.scripts]
keepyourprompts = "keepyourprompts.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/keepyourprompts"]

[tool.hatch.build.targets.sdist]
include = ["src/keepyourprompts", "README.md", "CHANGELOG.md", "LICENSE", "pyproject.toml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
filterwarnings = ["error::pytest.PytestUnraisableExceptionWarning"]

[tool.ruff]
line-length = 120
target-version = "py39"
src = ["src", "tests"]
extend-exclude = ["*.md"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = ["UP031", "UP006", "UP007", "UP035", "UP045", "SIM105", "RUF022"]
