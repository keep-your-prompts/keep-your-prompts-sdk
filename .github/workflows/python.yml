name: python

on:
  push:
    branches: [main]
    tags: ['python-v*'] # path filters are not evaluated for tag pushes
    paths: ['python/**', 'conformance/**', 'protocol/**', '.github/workflows/python.yml']
  pull_request:
    paths: ['python/**', 'conformance/**', 'protocol/**', '.github/workflows/python.yml']

permissions:
  contents: read

concurrency:
  group: python-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

defaults:
  run:
    working-directory: python
    shell: bash

jobs:
  test:
    name: test (python ${{ matrix.python }})
    strategy:
      fail-fast: false
      matrix:
        python: ['3.9', '3.13']
    runs-on: ubuntu-latest
    steps:
      # Fixture blobs are hashed byte for byte: never convert line endings.
      - run: git config --global core.autocrlf false
        working-directory: .
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: python/pyproject.toml
      - run: python -m pip install -e '.[dev]'
      - name: Lint
        if: matrix.python == '3.13'
        run: |
          ruff check .
          ruff format --check .
      - name: Test (conformance suite against conformance/fake_cdn.py, unit tests)
        run: python -m pytest -q
      - name: Test without OpenTelemetry (the core never imports it; otel tests skip)
        run: |
          python -m pip uninstall -y opentelemetry-sdk opentelemetry-api
          python -m pytest -q
      - name: Test without httpx (urllib fallback for AsyncClient)
        run: |
          python -m pip uninstall -y httpx
          python -m pytest -q -k async

  publish:
    name: publish to PyPI
    if: startsWith(github.ref, 'refs/tags/python-v')
    needs: test
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: read
      id-token: write # PyPI trusted publishing (OIDC): no token stored
    steps:
      - run: git config --global core.autocrlf false
        working-directory: .
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Check the tag matches the version
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' pyproject.toml)
          test "python-v${version}" = "${GITHUB_REF_NAME}" || { echo "tag ${GITHUB_REF_NAME} != ${version}"; exit 1; }
      - name: Ship the repository's license in the distributions
        run: cp ../LICENSE LICENSE
      - name: Build sdist and wheel
        run: |
          python -m pip install build
          python -m build
          # Both distributions must carry the license.
          tar -tzf dist/*.tar.gz | grep -q '/LICENSE$'
          python -m zipfile -l dist/*.whl | grep -q 'dist-info/licenses/LICENSE'
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: python/dist
