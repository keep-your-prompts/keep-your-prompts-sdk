name: adapter-claude-agent-sdk-python

on:
  push:
    branches: [main]
    tags: ['claude-agent-sdk-python-v*'] # path filters are not evaluated for tag pushes
    paths: ['adapters/claude-agent-sdk-python/**', 'python/**', 'conformance/**', '.github/workflows/adapter-claude-agent-sdk-python.yml']
  pull_request:
    paths: ['adapters/claude-agent-sdk-python/**', 'python/**', 'conformance/**', '.github/workflows/adapter-claude-agent-sdk-python.yml']

permissions:
  contents: read

concurrency:
  group: adapter-claude-agent-sdk-python-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

defaults:
  run:
    working-directory: adapters/claude-agent-sdk-python
    shell: bash

jobs:
  test:
    name: test (python ${{ matrix.python }})
    strategy:
      fail-fast: false
      matrix:
        python: ['3.10', '3.13']
    runs-on: ubuntu-latest
    steps:
      # Fixture blobs are hashed byte for byte: never convert line endings.
      - run: git config --global core.autocrlf false
        working-directory: .
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: |
            python/pyproject.toml
            adapters/claude-agent-sdk-python/pyproject.toml
      # The core SDK (keepyourprompts) from this repository, then the adapter.
      - run: python -m pip install -e ../../python -e '.[dev]'
      - name: Lint
        if: matrix.python == '3.13'
        run: |
          ruff check .
          ruff format --check .
      - name: Test (unit tests; the real-session test is opt-in with KYP_CLAUDE_E2E=1)
        run: python -m pytest -q

  publish:
    name: publish to PyPI
    if: startsWith(github.ref, 'refs/tags/claude-agent-sdk-python-v')
    needs: test
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: read
      id-token: write # PyPI trusted publishing (OIDC): no token stored
    steps:
      - run: git config --global core.autocrlf false
        working-directory: .
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Check the tag matches the version
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' pyproject.toml)
          test "claude-agent-sdk-python-v${version}" = "${GITHUB_REF_NAME}" || { echo "tag ${GITHUB_REF_NAME} != ${version}"; exit 1; }
      - name: Ship the repository's license in the distributions
        run: cp ../../LICENSE LICENSE
      - name: Build sdist and wheel
        run: |
          python -m pip install build
          python -m build
          # Both distributions must carry the license.
          tar -tzf dist/*.tar.gz | grep -q '/LICENSE$'
          python -m zipfile -l dist/*.whl | grep -q 'dist-info/licenses/LICENSE'
      - name: Publish keepyourprompts-claude-agent-sdk
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: adapters/claude-agent-sdk-python/dist
