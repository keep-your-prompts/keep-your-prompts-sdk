name: automation-zapier

on:
  push:
    branches: [main]
    tags: ['zapier-v*'] # path filters are not evaluated for tag pushes
    paths: ['automation/zapier/**', 'automation/test-vectors/**', 'conformance/cases.json', '.github/workflows/automation-zapier.yml']
  pull_request:
    paths: ['automation/zapier/**', 'automation/test-vectors/**', 'conformance/cases.json', '.github/workflows/automation-zapier.yml']

permissions:
  contents: read

concurrency:
  group: automation-zapier-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

defaults:
  run:
    working-directory: automation/zapier
    shell: bash

env:
  ZAPIER_CLI: zapier-platform-cli@19.2.1

jobs:
  test:
    name: test (node 22, Zapier's runtime)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: automation/zapier/package-lock.json
      - run: npm ci
      - name: Test (appTester + nock, shared webhook vectors, conformance render cases)
        run: npm test
      - name: Validate (schema and Zapier integration checks)
        run: npx --yes -p "$ZAPIER_CLI" zapier-platform validate

  publish:
    name: push to Zapier
    if: startsWith(github.ref, 'refs/tags/zapier-v')
    needs: test
    runs-on: ubuntu-latest
    environment: zapier
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: automation/zapier/package-lock.json
      - name: Check the tag matches the version
        run: |
          version=$(node -p "require('./package.json').version")
          test "zapier-v${version}" = "${GITHUB_REF_NAME}" || { echo "tag ${GITHUB_REF_NAME} != ${version}"; exit 1; }
      - run: npm ci
      - name: Link the Zapier integration
        env:
          ZAPIER_APP_ID: ${{ vars.ZAPIER_APP_ID }}
        run: |
          test -n "$ZAPIER_APP_ID" || { echo "set the ZAPIER_APP_ID variable (zapier-platform register prints it)"; exit 1; }
          printf '{"id": %s, "key": "App%s"}\n' "$ZAPIER_APP_ID" "$ZAPIER_APP_ID" > .zapierapprc
      - name: Push (private version; promote it in Zapier when ready)
        env:
          ZAPIER_DEPLOY_KEY: ${{ secrets.ZAPIER_DEPLOY_KEY }}
        run: npx --yes -p "$ZAPIER_CLI" zapier-platform push
