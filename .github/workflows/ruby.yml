name: ruby

on:
  push:
    branches: [main]
    tags: ['ruby-v*'] # path filters are not evaluated for tag pushes
    paths: ['ruby/**', 'conformance/**', 'protocol/**', '.github/workflows/ruby.yml']
  pull_request:
    paths: ['ruby/**', 'conformance/**', 'protocol/**', '.github/workflows/ruby.yml']

permissions:
  contents: read

concurrency:
  group: ruby-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

defaults:
  run:
    working-directory: ruby
    shell: bash

jobs:
  test:
    name: test (ruby ${{ matrix.ruby }})
    strategy:
      fail-fast: false
      matrix:
        ruby: ['3.1', '3.2', '3.3', '3.4']
    runs-on: ubuntu-latest
    steps:
      # Fixture blobs are hashed byte for byte: never convert line endings.
      - run: git config --global core.autocrlf false
        working-directory: .
      - uses: actions/checkout@v4
      # bundle install once per Ruby version and Gemfile, cached by setup-ruby.
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true
          working-directory: ruby
      # conformance/fake_cdn.py serves the fixtures over HTTP.
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Minitest (unit + the 12 conformance behaviours)
        run: bundle exec rake test
      - name: RuboCop
        if: matrix.ruby == '3.4'
        run: bundle exec rubocop
      - name: Build the gem
        run: gem build keepyourprompts.gemspec -o "$RUNNER_TEMP/keepyourprompts.gem"

  publish:
    name: publish to RubyGems
    if: startsWith(github.ref, 'refs/tags/ruby-v')
    needs: test
    runs-on: ubuntu-latest
    environment: rubygems
    permissions:
      contents: read
      id-token: write # RubyGems trusted publishing (OIDC): no API key stored
    steps:
      - run: git config --global core.autocrlf false
        working-directory: .
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.4'
      - name: Check the tag matches the version
        run: |
          version=$(ruby -r ./lib/keepyourprompts/version -e 'print KeepYourPrompts::VERSION')
          test "ruby-v${version}" = "${GITHUB_REF_NAME}" || { echo "tag ${GITHUB_REF_NAME} != ${version}"; exit 1; }
      - name: Ship the repository's license in the gem
        run: cp ../LICENSE LICENSE
      - name: Build
        run: |
          gem build keepyourprompts.gemspec -o keepyourprompts.gem
          gem spec keepyourprompts.gem files | grep -qx -- '- LICENSE'
      # Trusted publisher configured on rubygems.org for this repository, workflow and environment.
      - uses: rubygems/configure-rubygems-credentials@v1.0.0
      - name: Push
        run: gem push keepyourprompts.gem
