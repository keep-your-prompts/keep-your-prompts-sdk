name: cli

on:
  push:
    branches: [main]
    tags: ['cli-v*'] # path filters are not evaluated for tag pushes
    paths: ['cli/**', 'go/**', '.github/workflows/cli.yml']
  pull_request:
    paths: ['cli/**', 'go/**', '.github/workflows/cli.yml']

permissions:
  contents: read

concurrency:
  group: cli-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

defaults:
  run:
    working-directory: cli
    shell: bash

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - run: git config --global core.autocrlf false
        working-directory: .
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
          cache-dependency-path: |
            cli/go.mod
            go/go.mod
      # cli/go.work builds against the SDK in ../go.
      - run: go vet ./...
      - run: go test -race -count=1 ./...
      - if: runner.os == 'Linux'
        run: |
          test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
          go run honnef.co/go/tools/cmd/staticcheck@latest ./...

  build:
    name: build (${{ matrix.goos }}/${{ matrix.goarch }})
    strategy:
      matrix:
        goos: [linux, darwin, windows]
        goarch: [amd64, arm64]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
          cache-dependency-path: |
            cli/go.mod
            go/go.mod
      - name: go build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: '0'
        run: go build -trimpath -o /dev/null ./cmd/kyp

  # Tag cli-vX.Y.Z: build every target and attach the archives and checksums to
  # the GitHub release (the only place binaries are published; no Actions artifacts).
  release:
    if: startsWith(github.ref, 'refs/tags/cli-v')
    needs: [test, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
          cache-dependency-path: |
            cli/go.mod
            go/go.mod
      - name: Build release archives
        run: scripts/build.sh "${GITHUB_REF_NAME}"
      - name: Create or update the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          version="${TAG#cli-v}"
          # Release notes: this version's CHANGELOG section.
          awk -v v="$version" '/^## /{p = index($0, "[" v "]") > 0; next} p' CHANGELOG.md > notes.md
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/* --clobber
          else
            gh release create "$TAG" dist/* --title "kyp $version" --notes-file notes.md
          fi
