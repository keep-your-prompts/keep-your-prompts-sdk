name: php

on:
  push:
    branches: [main]
    tags: ['php-v*'] # path filters are not evaluated for tag pushes
    paths: ['php/**', 'conformance/**', 'protocol/**', '.github/workflows/php.yml']
  pull_request:
    paths: ['php/**', 'conformance/**', 'protocol/**', '.github/workflows/php.yml']

permissions:
  contents: read

concurrency:
  group: php-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

defaults:
  run:
    working-directory: php
    shell: bash

jobs:
  test:
    name: test (php ${{ matrix.php }})
    strategy:
      fail-fast: false
      matrix:
        php: ['8.1', '8.2', '8.3', '8.4']
    runs-on: ubuntu-latest
    steps:
      # Fixture blobs are hashed byte for byte: never convert line endings.
      - run: git config --global core.autocrlf false
        working-directory: .
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: curl, apcu
          ini-values: apc.enable_cli=1
          coverage: none
          tools: composer:v2
      # conformance/fake_cdn.py serves the fixtures over HTTP.
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: composer-${{ runner.os }}-php${{ matrix.php }}-${{ hashFiles('php/composer.json') }}
          restore-keys: composer-${{ runner.os }}-php${{ matrix.php }}-
      - run: composer validate --no-check-publish
      # No lock file is committed (it is a library): resolve per PHP version, e.g. Laravel 10 on 8.1.
      - run: composer update --no-interaction --no-progress --prefer-dist
      - name: PHPUnit (unit + the 12 conformance behaviours)
        run: vendor/bin/phpunit
      - name: PHPStan (level max)
        if: matrix.php == '8.4'
        run: vendor/bin/phpstan analyse --no-progress --memory-limit=1G

  # Packagist reads composer.json from the root of a repository and versions from its tags, so a
  # release pushes php/ to the read-only split mirror keep-your-prompts/kyp-php and tags it vX.Y.Z.
  # Packagist's GitHub hook on that mirror picks the tag up; the API call below is a fallback.
  publish:
    name: publish to Packagist (split mirror)
    if: startsWith(github.ref, 'refs/tags/php-v')
    needs: test
    runs-on: ubuntu-latest
    environment: packagist
    permissions:
      contents: read
    env:
      MIRROR: keep-your-prompts/kyp-php
    steps:
      - uses: actions/checkout@v4
      - name: Check the tag matches the version
        run: |
          version=$(sed -n "s/.*public const VERSION = '\(.*\)';/\1/p" src/Options.php)
          test "php-v${version}" = "${GITHUB_REF_NAME}" || { echo "tag ${GITHUB_REF_NAME} != ${version}"; exit 1; }
          echo "VERSION=${version}" >> "$GITHUB_ENV"
      - name: Push php/ to the split mirror and tag it
        env:
          MIRROR_TOKEN: ${{ secrets.PHP_MIRROR_TOKEN }} # fine-grained PAT: contents read/write on the mirror only
        run: |
          test -n "$MIRROR_TOKEN" || { echo "set secrets.PHP_MIRROR_TOKEN"; exit 1; }
          git clone --quiet "https://x-access-token:${MIRROR_TOKEN}@github.com/${MIRROR}.git" "$RUNNER_TEMP/mirror"
          cd "$RUNNER_TEMP/mirror"
          git rm -rq --ignore-unmatch .
          cp -a "$GITHUB_WORKSPACE/php/." .
          if [ -f "$GITHUB_WORKSPACE/LICENSE" ]; then cp "$GITHUB_WORKSPACE/LICENSE" LICENSE; fi
          git add -A
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
            commit --quiet --allow-empty -m "Release ${VERSION}" -m "From ${GITHUB_REPOSITORY}@${GITHUB_SHA} (${GITHUB_REF_NAME})."
          git tag -a "v${VERSION}" -m "keepyourprompts/sdk ${VERSION}"
          git push --quiet origin HEAD:main "v${VERSION}"
      - name: Ask Packagist to update now
        env:
          PACKAGIST_USERNAME: ${{ vars.PACKAGIST_USERNAME }}
          PACKAGIST_TOKEN: ${{ secrets.PACKAGIST_TOKEN }}
        run: |
          if [ -z "$PACKAGIST_TOKEN" ]; then echo "no PACKAGIST_TOKEN: relying on the mirror's GitHub hook"; exit 0; fi
          curl -fsS -X POST -H 'Content-Type: application/json' \
            "https://packagist.org/api/update-package?username=${PACKAGIST_USERNAME}&apiToken=${PACKAGIST_TOKEN}" \
            -d '{"repository":{"url":"https://packagist.org/packages/keepyourprompts/sdk"}}'
