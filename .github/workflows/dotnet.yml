name: dotnet

on:
  push:
    branches: [main]
    tags: ['dotnet-v*']
    paths: ['dotnet/**', 'conformance/**', 'protocol/**', '.github/workflows/dotnet.yml']
  pull_request:
    paths: ['dotnet/**', 'conformance/**', 'protocol/**', '.github/workflows/dotnet.yml']

permissions:
  contents: read

concurrency:
  group: dotnet-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

defaults:
  run:
    working-directory: dotnet
    shell: bash

env:
  DOTNET_NOLOGO: 'true'
  DOTNET_CLI_TELEMETRY_OPTOUT: 'true'
  CI: 'true'

jobs:
  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      # Fixture blobs are hashed byte for byte: never convert line endings.
      - run: git config --global core.autocrlf false
        working-directory: .
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x
          cache: true
          cache-dependency-path: dotnet/**/*.csproj
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: dotnet restore KeepYourPrompts.sln
      - name: Build (net8.0 and netstandard2.0, warnings are errors)
        run: dotnet build KeepYourPrompts.sln -c Release --no-restore
      - name: Test on net8.0 and net10.0 (HttpListener fake and conformance/fake_cdn.py)
        run: dotnet test KeepYourPrompts.sln -c Release --no-build
      - name: Pack
        run: dotnet pack KeepYourPrompts.sln -c Release --no-build -o artifacts

  publish:
    name: publish to NuGet
    if: startsWith(github.ref, 'refs/tags/dotnet-v')
    needs: test
    runs-on: ubuntu-latest
    environment: nuget
    permissions:
      contents: read
      id-token: write # NuGet trusted publishing (OIDC)
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x
      - name: Check the tag matches the version
        run: |
          version=$(sed -n 's:.*<Version>\(.*\)</Version>.*:\1:p' Directory.Build.props)
          test "dotnet-v${version}" = "${GITHUB_REF_NAME}" || { echo "tag ${GITHUB_REF_NAME} != ${version}"; exit 1; }
      - name: Pack
        run: dotnet pack KeepYourPrompts.sln -c Release -o artifacts
      # Trusted publishing: a short-lived API key from the policy configured on nuget.org for this repo.
      - name: NuGet login (trusted publishing)
        id: login
        if: vars.NUGET_USER != ''
        uses: NuGet/login@v1
        with:
          user: ${{ vars.NUGET_USER }}
      - name: Push
        env:
          NUGET_API_KEY: ${{ steps.login.outputs.NUGET_API_KEY || secrets.NUGET_API_KEY }}
        run: |
          test -n "$NUGET_API_KEY" || { echo "set vars.NUGET_USER (trusted publishing) or secrets.NUGET_API_KEY"; exit 1; }
          dotnet nuget push "artifacts/*.nupkg" --api-key "$NUGET_API_KEY" --source https://api.nuget.org/v3/index.json --skip-duplicate
